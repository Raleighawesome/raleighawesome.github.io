<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik Newby - Apps</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0A;
            color: #F5F5F5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container { max-width: 600px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .accent { color: #00D9A5; }
        p { color: #888; margin-bottom: 2rem; line-height: 1.6; }
        .apps { display: flex; flex-direction: column; gap: 1rem; }
        .app-card {
            background: #141414;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s;
        }
        .app-card:hover { border-color: #00D9A5; }
        .app-name { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
        .app-desc { color: #888; font-size: 0.9rem; }
        .links { margin-top: 2rem; }
        .links a { color: #00D9A5; margin: 0 1rem; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Erik <span class="accent">Newby</span></h1>
        <p>iOS Developer</p>

        <div class="apps">
            <div class="app-card">
                <div class="app-name">OnPace Lease</div>
                <div class="app-desc">Keep your lease on pace, never pay overage fees.</div>
            </div>
        </div>

        <div class="links">
            <a href="/onpacelease/privacy.html">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
